name: Delivery checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  delivery-checks:
    name: delivery-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
      - name: Verify static resources and JavaScript syntax
        run: python3 scripts/check-static.py
