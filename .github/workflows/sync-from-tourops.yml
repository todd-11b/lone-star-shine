name: Inspect legacy TourOps demo source

# Direct scheduled force-push sync is retired. Changes use the reviewed PR and
# verified-deployment process; this manual job only reports source differences.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspect-legacy-demo-source
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compare legacy source without changing the remote repository
        run: |
          git fetch --no-tags --depth=1 https://github.com/todd-11b/tourops-landing.git refs/heads/claude/cleaning-website-design-VH2Dj
          git diff --stat HEAD FETCH_HEAD
          echo "::notice::Inspection only. Review any proposed change in a pull request before merge and deployment."
